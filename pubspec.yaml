name: qunleashed
description: "Flipper Zero BLE/USB companion app."
homepage: https://aperturefox.ru
publish_to: 'none'
# The version being built *toward*, not the last one released: ADR 0014 §2.
# Moving it opens the next cycle and is a commit somebody makes on purpose,
# because choosing patch against minor against major is the decision - CI never
# picks a digit, it only refuses a tag that disagrees with this and a version
# that has already been published.
#
# No build number. §6 derives it from the commit count, so one here would be a
# number that means nothing; the build scripts that fall back to reading
# this line stop at the `+` and are unaffected either way.
version: 0.17.3

environment:
  # What this actually builds on, rather than a wider window.
  # setup-flutter pins 3.47.1 and runs pub get with --enforce-lockfile, and
  # flutter_test pins matcher, test_api, vector_math and meta to exact
  # versions that move with the SDK. Declaring a floor below the one CI uses
  # therefore hands someone a `pub get` that resolves and a build that fails
  # with nothing pointing back here.
  sdk: ^3.13.1
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flipperlib:
    path: lib/modules/flipperlib
  dartufbt:
    path: lib/modules/dartufbt
  super_drag_and_drop:
    path: lib/modules/extensions/super_drag_and_drop
  super_clipboard:
    path: lib/modules/extensions/super_clipboard
  universal_ble: ^3.2.0
  usb_serial: ^0.5.2
  permission_handler: ^11.3.1
  flutter_libserialport: ^0.6.0
  flutter_svg: ^2.0.10+1
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  crypto: ^3.0.7
  pasteboard: ^0.6.0
  # The ceiling buys one thing, and it is not the obvious one. 4.6.0 carries
  # eight *BREAKING CHANGE* lines inside a minor, whose common subject is that
  # `throwOnError` now gates every damage report and defaults to `verify`,
  # which defaults to false. Measured on the firmware installer's own call -
  # `GZipDecoder().decodeBytes` then `TarDecoder().decodeBytes` - at the
  # version main ships, the one taken here, and the one held off:
  #
  #                            4.0.9        4.5.2        4.6.0
  #   truncated, no flags      silent       silent       silent
  #   truncated, verify        silent       silent       THROWS
  #   truncated, decodeStream  true (!)     false        false
  #   bad gzip CRC, no flags   THROWS       THROWS       silent, full length
  #   bad gzip CRC, verify     THROWS       THROWS       THROWS
  #
  # So the loss at 4.6.0 is row four: a bit-rotted download that throws today
  # with no flags decodes clean there. That is the whole of the hold. A
  # truncated archive has been silently partial at every version, including
  # the one in production - that is a pre-existing hole, not a 4.6.0
  # regression, and `archive-4.5.2/lib/src/codecs/gzip_decoder.dart` says so
  # in the doc comment on the method the installer calls.
  #
  # Row three is why this bump is worth taking rather than reverting: at 4.0.9
  # `decodeStream` returns true for a truncated gzip, and from 4.5.2 it
  # returns false. The gate for a half-downloaded firmware update becomes
  # buildable here and was not before.
  #
  # 4.6.0 is then the version to migrate *to*, not away from, once all seven
  # decode sites pass flags - two of them live in the `dartufbt` submodule, so
  # it is a PR in another repository plus a bump here. It also changes what
  # `ZipDecoder` hands back for an unreadable local header
  # (named-with-no-content, where 4.0.x gave a nameless entry), which
  # `atp_unpack_test.dart` asserts on and a comment in `atp_source.dart`
  # describes. A migration with its own tests, not a lockfile move.
  archive: '>=4.0.0 <4.6.0'
  markdown: ^7.3.0
  flutter_html: ^3.0.0-beta.2
  flutter_html_table: ^3.0.0-beta.2
  # Not used directly: this is a ceiling on flutter_html's behalf, and the
  # only way pub lets one be written is a dependency. flutter_html 3.0.0 -
  # the newest release as of November 2026 - reaches into
  # `package:html/src/query_selector.dart`
  # behind an `// ignore: implementation_imports` for a top-level
  # `matches(Element, String)`. html 0.15.7 deleted it, keeping only a method
  # over a parsed `SelectorGroup`, so the patch bump fails *compilation* of
  # every test that loads a widget tree: "Method not found: 'matches'".
  # Lift this when flutter_html publishes a fix, or when flutter_html goes.
  html: '>=0.15.6 <0.15.7'
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  diffutil_dart: ^5.0.0
  file_picker: ^8.1.2
  ffi: ^2.1.3
  flutter_map: ^8.3.2
  http: ^1.6.0
  latlong2: ^0.10.1
  geolocator: ^13.0.1
  path_provider: ^2.1.4
  package_info_plus: ^8.1.0
  device_info_plus: ^11.5.0
  url_launcher: ^6.3.1
  # The floor is not about notifications. `flutter_local_notifications_linux`
  # pinned `dbus: ^0.7.8` through 8.0.1 and 8.0.2 widened it to
  # `>=0.7.8 <0.9.0`; universal_ble 3.1.1 moved to `bluez: ^0.9.0`, which
  # wants `dbus: ^0.8.0`. So this constraint is what decides whether the BLE
  # plugin can go past 3.1.0 - and staying below 3.1.1 is not expressible as a
  # caret, so the alternative to this bump is pinning the BLE plugin under its
  # own latest to avoid a notifications one.
  #
  # The step that does the deciding is one further in: 8.0.2 needs
  # `flutter_local_notifications_platform_interface: ^12.0.0`, and 21.0.0 pins
  # `^11.0.0` - so under 21.x the newest reachable Linux package is 8.0.0 and
  # `dbus` stays capped below 0.8.0, whatever that release's own `^8.0.0`
  # allows. 22.0.0 already permits 8.0.2; 22.3.2 is the first that requires
  # it, which is why the floor is here and not there.
  #
  # 22.0.0 broke nothing this app calls. The three users between them call
  # `initialize`, `show`, `cancel`, `createNotificationChannel`,
  # `getNotificationAppLaunchDetails`, `resolvePlatformSpecificImplementation`,
  # `requestNotificationsPermission` and `requestPermissions`, and all of those
  # are unchanged from 21.0.0 through 22.3.3. What 22.0.0 did was add Web
  # support, move where Windows reports an UnsupportedError for
  # `periodicallyShow` (never called here), highlight the app on
  # `requestNotificationPolicyAccess` (never called), and widen the `xml`
  # range in its Windows package.
  #
  # What it does carry in: `flutter_local_notifications_web`, whose 3.4 KB
  # service worker is bundled into every artifact, because Flutter's asset
  # bundler is not platform-filtered even though the plugin itself is. Nothing
  # on a target this app ships can load it.
  flutter_local_notifications: ^22.3.2
  logger: ^2.7.0
  logging: ^1.3.0
  window_manager: ^0.5.1
  xterm: ^4.0.0
  share_plus: ^12.0.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  shared_preferences: ^2.5.5
  flutter_foreground_task: ^9.2.2
  # Pinned exactly, and 9.30.0 is the floor: it fixed a native worker leaked
  # per engine, reported by a BLE app with a headless engine - the home
  # widget's shape (sentry-dart#3960). 10.0 requires Swift Package Manager,
  # which this repository does not use, so moving is its own task. ADR 0013 §7.
  sentry_flutter: 9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets a test stand in for getTemporaryDirectory. Mocking the method channel
  # is not enough: path_provider_windows is pure Dart over FFI and never goes
  # near a channel, so the platform interface is the only seam that works
  # everywhere.
  path_provider_platform_interface: ^2.1.2
  # Same idea for preferences: setMockInitialValues gives a store whose writes
  # always succeed, so the only way to test what happens when one does not is
  # to stand in at the platform interface.
  shared_preferences_platform_interface: ^2.4.2
  # Parses lib/ for test/log_level_budget_test.dart, which counts failures
  # logged where a release build cannot see them. A parser rather than a regex
  # because `extension E on T {` and `mixin M on B {` are spelled exactly like
  # a bare `on T {` catch clause, and only an AST can tell them apart.
  analyzer: ^14.4.0
  # Uploads debug information so a stack trace in Sentry names functions and
  # lines rather than addresses: dSYMs, PDBs, Android and Linux native symbols,
  # and the Dart symbol map. A dev dependency because it is a build-time tool
  # and nothing in `lib/` imports it - the import ratchet counts it as the SDK
  # either way, which is correct.
  #
  # It does **not** cover the R8 mapping. That wants the Sentry Android Gradle
  # Plugin with auto-install off, which is its own change in `android/` and is
  # not here yet. ADR 0013 Consequences.
  sentry_dart_plugin: ^3.4.0

dependency_overrides:
  super_clipboard:
    path: lib/modules/extensions/super_clipboard
  super_native_extensions:
    path: lib/modules/extensions/super_native_extensions
  irondash_engine_context:
    path: lib/modules/irondash/engine_context/dart
  irondash_message_channel:
    path: lib/modules/irondash/message_channel/dart

# How `sentry_dart_plugin` uploads. The org and project are not secrets; the
# token is, and is read from the environment (`SENTRY_AUTH_TOKEN`) rather than
# from here - see docs/releasing.md.
#
# `release` is left out on purpose. The plugin would otherwise derive it from
# this file's `version`, which carries no channel and no build number, and
# every dev build of a cycle would upload under the same name. CI passes the
# one `derive_version.sh` produces instead, which is the string
# `BuildStamp.sentryRelease` makes the events carry. 0014 §5.
#
# `wait_for_processing` is what makes the upload step's failure branch mean
# anything. It defaults to false (`configuration.dart`), which omits
# `sentry-cli --wait`, so the command returns as soon as the server has
# accepted the chunks - before it has parsed them. A debug file Sentry then
# rejects, or a PDB whose debug id pairs with nothing that shipped, never
# changes the exit code and nothing reports it. With this on, a server-side
# rejection becomes a non-zero exit, which the action turns into a warning and
# a step-summary line. It costs the upload's processing time; #310 is what it
# costs not to have it.
sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  wait_for_processing: true
  org: dark-flippers
  project: qunleashed

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  fonts:
    - family: Born2bSportyV3
      fonts:
        - asset: assets/font/born2b-sporty-v3.ttf
    - family: GravityBold8
      fonts:
        - asset: assets/font/gravity-bold-8.ttf
  assets:
    - assets/ic/action/
    - assets/ic/appcat/
    - assets/ic/app/
    - assets/ic/control/
    - assets/ic/control/hint/
    - assets/ic/device/
    - assets/ic/file/
    - assets/ic/fileformat/
    - assets/ic/info/
    - assets/ic/nav/
    - assets/ic/state/
    - assets/ic/storage/
    - assets/img/
    - assets/img/firmware/
    - assets/pic/app/
    - assets/pic/device/body/
    - assets/pic/device/screen/
    - assets/pic/mifare/
    - assets/pic/status/
    - assets/anim/
    - assets/anim/L3_Fireplace_128x64/
    - assets/atp/
    - LICENSE
