name: qunleashed
description: "Flipper Zero BLE/USB companion app."
homepage: https://aperturefox.ru
publish_to: 'none'
version: 0.12.1+12001

environment:
  # What this actually builds on, rather than a wider window.
  # setup-flutter pins 3.47.1 and runs pub get with --enforce-lockfile, and
  # flutter_test pins matcher, test_api, vector_math and meta to exact
  # versions that move with the SDK. Declaring a floor below the one CI uses
  # therefore hands someone a `pub get` that resolves and a build that fails
  # with nothing pointing back here.
  sdk: ^3.13.1
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flipperlib:
    path: lib/modules/flipperlib
  dartufbt:
    path: lib/modules/dartufbt
  universal_ble: ^2.1.1
  usb_serial: ^0.5.2
  permission_handler: ^11.3.1
  flutter_libserialport: ^0.6.0
  flutter_svg: ^2.0.10+1
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  crypto: ^3.0.7
  saver_gallery: ^4.1.1
  pasteboard: ^0.5.0
  archive: ^4.0.0
  markdown: ^7.3.0
  flutter_html: ^3.0.0-beta.2
  flutter_html_table: ^3.0.0-beta.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  diffutil_dart: ^5.0.0
  file_picker: ^8.1.2
  ffi: ^2.1.3
  flutter_map: ^7.0.2
  http: ^1.6.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  path_provider: ^2.1.4
  package_info_plus: ^8.1.0
  device_info_plus: ^11.5.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0
  logger: ^2.7.0
  logging: ^1.3.0
  window_manager: ^0.5.1
  xterm: ^4.0.0
  share_plus: ^10.1.4
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  shared_preferences: ^2.5.5
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets a test stand in for getTemporaryDirectory. Mocking the method channel
  # is not enough: path_provider_windows is pure Dart over FFI and never goes
  # near a channel, so the platform interface is the only seam that works
  # everywhere.
  path_provider_platform_interface: ^2.1.2
  # Same idea for preferences: setMockInitialValues gives a store whose writes
  # always succeed, so the only way to test what happens when one does not is
  # to stand in at the platform interface.
  shared_preferences_platform_interface: ^2.4.2
  # Parses lib/ for test/log_level_budget_test.dart, which counts failures
  # logged where a release build cannot see them. A parser rather than a regex
  # because `extension E on T {` and `mixin M on B {` are spelled exactly like
  # a bare `on T {` catch clause, and only an AST can tell them apart.
  analyzer: ^14.4.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  fonts:
    - family: FlipperBold
      fonts:
        - asset: assets/font/flipper-bold.ttf
          weight: 500
    - family: Born2bSportyV2
      fonts:
        - asset: assets/font/born2b-sporty-v2.ttf
    - family: GravityBold8
      fonts:
        - asset: assets/font/gravity-bold-8.ttf
  assets:
    - assets/ic/action/
    - assets/ic/appcat/
    - assets/ic/app/
    - assets/ic/control/
    - assets/ic/control/hint/
    - assets/ic/device/
    - assets/ic/file/
    - assets/ic/fileformat/
    - assets/ic/info/
    - assets/ic/nav/
    - assets/ic/state/
    - assets/ic/storage/
    - assets/img/
    - assets/img/firmware/
    - assets/pic/app/
    - assets/pic/device/body/
    - assets/pic/device/screen/
    - assets/pic/mifare/
    - assets/pic/status/
    - assets/anim/
    - assets/anim/L3_Fireplace_128x64/
    - assets/atp/
    - LICENSE
