name: Crowdin

on:
  push:
    branches:
      - main
    paths:
      - "translations/app_en.arb"
      - "fastlane/metadata/android/en-US/**"
      - "crowdin.yml"
  schedule:
    # Pull finished translations once a day, at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  synchronize:
    name: Sync sources and translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Crowdin sync
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          # A push only ships new source strings; translations come back on the
          # schedule and on manual runs, so day-to-day pushes stay PR-free.
          download_translations: ${{ github.event_name != 'push' }}
          localization_branch_name: l10n/crowdin
          create_pull_request: true
          pull_request_title: "New translations from Crowdin"
          pull_request_base_branch_name: main
          commit_message: "Update translations from Crowdin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
