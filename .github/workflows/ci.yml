name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reading the pull request's file list needs more than the workflow's
    # default contents-only grant.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # All are pure bash and need neither Flutter nor the Firebase stub. They
      # run first so a broken setup cannot mask a regression in release logic.
      # auto-release.yml can be dispatched now, but a unit test is faster and
      # deterministic, so it stays the first line of defence.
      - name: Test the release version derivation
        run: .github/scripts/derive_version_test.sh

      - name: Test the release checksums
        run: .github/scripts/checksums_test.sh

      - name: Test the Android artifact verification
        run: .github/scripts/verify_apks_test.sh

      # The guard's other two modes run on the release path only, and the thing
      # they watch - the build image's GLib - cannot be made to move from here.
      # So this is where their logic is checked: #280 was a published binary
      # that could not start, and the floor is now a number a test can drive.
      - name: Test the Linux ABI floor guard
        run: .github/scripts/check_linux_abi_test.sh

      # This one is not a test of the guard but the guard itself, and it is the
      # only part of the #280 fix a pull request can see: nothing here builds
      # Linux, so a change of `runs-on` back to a floating label would
      # otherwise go green and be caught by the run that publishes.
      - name: Check the Linux build image is pinned
        run: .github/scripts/check_linux_abi.sh --check-runner

      # The guard itself only ever runs on a tagged release, on macOS. This runs
      # its logic here so it is not first trusted at the moment it matters.
      - name: Test the Apple FFI export guard
        run: .github/scripts/check_ffi_exports_test.sh

      - name: Test the translation source guard
        run: .github/scripts/check_translation_sources_test.sh

      # The release notes are hand-written and, until this guard, nothing read
      # them - which is how the file came to name 0.15.0 while 0.16.0-dev was
      # the published build. The check is on the shape, not the prose.
      - name: Test the changelog guard
        run: .github/scripts/check_changelog_test.sh

      - name: Check the changelog
        run: .github/scripts/check_changelog.sh

      # Only ever runs on a release, which is the least-rehearsed path there
      # is, and it writes the one file CI refuses a build over.
      - name: Test the cycle opener
        run: .github/scripts/open_next_cycle_test.sh

      # Its output is published prose rather than a build decision, so nothing
      # downstream goes red when it is wrong - somebody reads the release page
      # and finds it describing the wrong build.
      - name: Test the release body
        run: .github/scripts/release_body_test.sh

      # Why: the probe's own header. The only thing anywhere that runs the
      # generated engine, and it needs no Flutter.
      - name: Check the SubGHz seed-recovery engine
        run: .github/scripts/check_faaccrack_engine.sh

      # The sync's own compile check reports through this. Its pull requests
      # run no jobs of their own (#40), so a mistake in the summariser would
      # surface as a translation silently reported as fine.
      - name: Test the translation compile summary
        run: .github/scripts/summarize_l10n_failure_test.sh

      # Nothing in CI runs --write any more - Crowdin normalises its own export
      # now, and check_arb_locales.sh's header says why - but the flag is still
      # the lever for a repair by hand if that app is ever gone, and this is the
      # only thing that exercises it.
      - name: Test the ARB locale guard
        run: .github/scripts/check_arb_locales_test.sh

      # Which of the two families of pub get failure a job is looking at. The
      # call is in setup-flutter, where no test can reach it.
      - name: Test the pub get failure message
        run: .github/scripts/pub_get_failure_message_test.sh

      # The button font is built from text, not drawn in an editor: every
      # glyph is a block of # and . in font/src, and the .ttf is committed so
      # nothing has to run before the app compiles. This is what keeps the two
      # from drifting apart. fonttools is pinned because --check compares bytes
      # and a new version may legitimately pad a table differently.
      - name: Set up Python for the font build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the font build's dependency
        run: pip install fonttools==4.56.0

      - name: Check the button font matches its source
        run: python font/build.py --check

      # Why any of this exists is in the script's own header. What is specific
      # to running it here:
      #
      # The file list is asked of the API rather than worked out from the
      # checkout, because the clone is shallow, so the merge base a three-dot
      # diff needs is not necessarily present, and a two-dot one would flag any
      # branch that simply has not been rebased since the last sync. Paginated,
      # because a guard that stops looking after the first hundred files is one
      # a large enough pull request walks straight through. And previous_filename
      # as well as filename, because a rename reports only where the file
      # landed, and moving one out of Crowdin's pattern breaks the sync just as
      # thoroughly as editing it.
      #
      # shell: bash for the pipefail that a bare run block does not get. Left
      # off, a failure to reach the API would empty the pipeline, the guard
      # would find nothing to object to, and the check would pass green having
      # examined no files at all.
      - name: Check nothing edits a translation by hand
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | .github/scripts/check_translation_sources.sh

      # Catches what only running a workflow would otherwise catch, and the
      # release workflow only publishes on a tag.
      - name: Lint the workflows
        run: .github/scripts/lint_workflows.sh

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # firebase_options.dart is generated, gitignored and restored from a
      # secret only for releases. CI never restores the real config, so the
      # placeholder is always written, fork or not.
      - name: Stub the Firebase configuration
        run: .github/scripts/stub_firebase_config.sh

      - name: Check formatting
        run: .github/scripts/check_format.sh

      - name: Analyze
        run: flutter analyze

      # Randomised rather than declared order, and only randomised: a suite
      # that passes in any order passes in the declared one too, so this is
      # the stronger of the two and costs no extra run.
      #
      # The seed is new every time, which is the point - an ordering fault
      # that only one arrangement shows would otherwise sit there until it
      # happened to matter. `flutter test` prints the seed it chose
      # ("Shuffling test order with --test-randomize-ordering-seed=N"), so a
      # red run is reproducible: pass that N locally.
      #
      # A failure here is a real bug, not flakiness. Test order is a hidden
      # dependency between files - one leaving a static set for the next, a
      # mock installed in one and read in another - and #139 was exactly that,
      # found by accident rather than by this.
      - name: Test
        run: flutter test --test-randomize-ordering-seed=random

      # The guards are compile-time consts, so the run above is always the
      # talking build. See the header of the test file. QLOG_EXPECT_QUIET is
      # what makes this job fail rather than quietly become a copy of that one
      # if QLOG ever stops reaching the build.
      #
      # `kept_sink_test.dart` is here for the same reason: the level flipperlib
      # is pinned at depends on whether the build prints, so half of its
      # assertions sit behind `if (!LogService.printing)` and never run in the
      # pass above. A file whose build-dependent branch is never executed is a
      # file asserting nothing about it.
      - name: Test the build that prints nothing
        run: >
          flutter test
          --test-randomize-ordering-seed=random
          --dart-define=QLOG=false
          --dart-define=QLOG_EXPECT_QUIET=true
          test/logging_kept_test.dart
          test/kept_sink_test.dart

  # `derive_version.sh` runs first in every one of the five build jobs, so a
  # fault in it is an outage of whichever platforms share the cause. It is the
  # only script in the repository that runs on all three runner OSes, and until
  # this job existed it was only ever tested under GNU userland: the job above
  # is ubuntu-only, so a BSD-only sed form shipped, passed every assertion, and
  # killed the macOS and iOS dev build on the first push to main after it
  # merged. The suite is pure bash and builds its own fixture repositories, so
  # running it here costs a runner boot and nothing else.
  #
  # Not every suite. `checksums_test.sh` calls `sha256sum`, which macOS has not
  # got, and `check_linux_abi_test.sh` is doubly out: its subject uses
  # `declare -A` and macOS still ships bash 3.2, so adding it here fails on the
  # option rather than on anything about the guard. The rest are simply not here
  # yet - `check_ffi_exports.sh` does run on a macOS build, so its suite would
  # belong.
  #
  # `release_body_test.sh` is here although its script runs only on
  # `ubuntu-latest`, because it leans on the answer for `grep -v -f <empty
  # file>` - not a thing to assume holds across userlands, and load-bearing for
  # every note at a cycle boundary. It costs a step on a runner this job has
  # already booted.
  scripts-bsd:
    name: Test the release scripts on BSD userland
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the release version derivation
        run: .github/scripts/derive_version_test.sh

      # Pure bash too, and both use mktemp, which is where BSD and GNU differ.
      - name: Test the changelog guard
        run: .github/scripts/check_changelog_test.sh

      - name: Test the cycle opener
        run: .github/scripts/open_next_cycle_test.sh

      - name: Test the release body
        run: .github/scripts/release_body_test.sh
