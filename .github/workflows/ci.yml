name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reading the pull request's file list needs more than the workflow's
    # default contents-only grant.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # All are pure bash and need neither Flutter nor the Firebase stub. They
      # run first so a broken setup cannot mask a regression in release logic.
      # auto-release.yml can be dispatched now, but a unit test is faster and
      # deterministic, so it stays the first line of defence.
      - name: Test the release version derivation
        run: .github/scripts/derive_version_test.sh

      - name: Test the release checksums
        run: .github/scripts/checksums_test.sh

      - name: Test the Android artifact verification
        run: .github/scripts/verify_apks_test.sh

      # The guard itself only ever runs on a tagged release, on macOS. This runs
      # its logic here so it is not first trusted at the moment it matters.
      - name: Test the Apple FFI export guard
        run: .github/scripts/check_ffi_exports_test.sh

      - name: Test the translation source guard
        run: .github/scripts/check_translation_sources_test.sh

      # Why: the probe's own header. The only thing anywhere that runs the
      # generated engine, and it needs no Flutter.
      - name: Check the SubGHz seed-recovery engine
        run: .github/scripts/check_faaccrack_engine.sh

      # The sync's own compile check reports through this. Its pull requests
      # run no jobs of their own (#40), so a mistake in the summariser would
      # surface as a translation silently reported as fine.
      - name: Test the translation compile summary
        run: .github/scripts/summarize_l10n_failure_test.sh

      # Why any of this exists is in the script's own header. What is specific
      # to running it here:
      #
      # The file list is asked of the API rather than worked out from the
      # checkout, because the clone is shallow, so the merge base a three-dot
      # diff needs is not necessarily present, and a two-dot one would flag any
      # branch that simply has not been rebased since the last sync. Paginated,
      # because a guard that stops looking after the first hundred files is one
      # a large enough pull request walks straight through. And previous_filename
      # as well as filename, because a rename reports only where the file
      # landed, and moving one out of Crowdin's pattern breaks the sync just as
      # thoroughly as editing it.
      #
      # shell: bash for the pipefail that a bare run block does not get. Left
      # off, a failure to reach the API would empty the pipeline, the guard
      # would find nothing to object to, and the check would pass green having
      # examined no files at all.
      - name: Check nothing edits a translation by hand
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | .github/scripts/check_translation_sources.sh

      # Catches what only running a workflow would otherwise catch, and the
      # release workflow only publishes on a tag.
      - name: Lint the workflows
        run: .github/scripts/lint_workflows.sh

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # firebase_options.dart is generated, gitignored and restored from a
      # secret only for releases. CI never restores the real config, so the
      # placeholder is always written, fork or not.
      - name: Stub the Firebase configuration
        run: .github/scripts/stub_firebase_config.sh

      - name: Check formatting
        run: .github/scripts/check_format.sh

      - name: Analyze
        run: flutter analyze

      # Randomised rather than declared order, and only randomised: a suite
      # that passes in any order passes in the declared one too, so this is
      # the stronger of the two and costs no extra run.
      #
      # The seed is new every time, which is the point - an ordering fault
      # that only one arrangement shows would otherwise sit there until it
      # happened to matter. `flutter test` prints the seed it chose
      # ("Shuffling test order with --test-randomize-ordering-seed=N"), so a
      # red run is reproducible: pass that N locally.
      #
      # A failure here is a real bug, not flakiness. Test order is a hidden
      # dependency between files - one leaving a static set for the next, a
      # mock installed in one and read in another - and #139 was exactly that,
      # found by accident rather than by this.
      - name: Test
        run: flutter test --test-randomize-ordering-seed=random

      # The guards are compile-time consts, so the run above is always the
      # talking build. See the header of the test file. QLOG_EXPECT_QUIET is
      # what makes this job fail rather than quietly become a copy of that one
      # if QLOG ever stops reaching the build.
      #
      # `kept_sink_test.dart` is here for the same reason: the level flipperlib
      # is pinned at depends on whether the build prints, so half of its
      # assertions sit behind `if (!LogService.printing)` and never run in the
      # pass above. A file whose build-dependent branch is never executed is a
      # file asserting nothing about it.
      - name: Test the build that prints nothing
        run: >
          flutter test
          --test-randomize-ordering-seed=random
          --dart-define=QLOG=false
          --dart-define=QLOG_EXPECT_QUIET=true
          test/logging_history_test.dart
          test/kept_sink_test.dart
