name: Crowdin RX

on:
  schedule:
    # Pull finished translations once a day, at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  download:
    name: Bring translations back from Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download translations
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: false
          upload_translations: false
          download_translations: true
          # Without this, Crowdin fills an untranslated string with the source
          # language - its own words for the option: "strings without approval
          # are fulfilled with the source language". So a language enabled in
          # the project but not yet worked on comes back as a complete file of
          # English, `gen-l10n` generates a locale for it, and the picker offers
          # a language the app does not speak. #141 shipped exactly that for
          # Ukrainian: 1293 strings, none of them Ukrainian.
          #
          # Not `skip_untranslated_files`, which omits a file that is not
          # *fully* translated - Russian is 1293 of 1307 keys, so that would
          # drop it the first time an English string is added.
          skip_untranslated_strings: true
          localization_branch_name: l10n/crowdin
          create_pull_request: true
          pull_request_title: "New translations from Crowdin"
          pull_request_base_branch_name: main
          commit_message: "Update translations from Crowdin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Find the translation pull request
        id: pr
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --head l10n/crowdin --state open --json number --jq '.[0].number')
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [ -z "$number" ]; then
            echo "No open translation pull request."
          else
            echo "Translation pull request is #${number}."
          fi

      # The Crowdin action runs in a container as root, and it commits and
      # pushes from there - so it leaves root-owned files behind, objects under
      # .git among them. The next checkout tries to clean the workspace, cannot
      # remove them, and gives up having already deleted what it could:
      #
      #   ##[warning]Unable to prepare the existing repository. The repository
      #   will be recreated instead.
      #   Deleting the contents of '/home/runner/work/qUnleashed/qUnleashed'
      #   ##[error]File was unable to be removed Error: EACCES: permission
      #   denied, unlink '.../.git/objects/1c/fafb8e1fa8d8cd...'
      #
      # What is left has no .git at all, so every step below that needs one
      # fails. Three runs died this way - 2026-10-05, and twice on 2026-10-06 -
      # and none of them looked like a translation problem, because the pull
      # request is created in the step above and arrives either way. What was
      # lost is the build that verifies it and the status in its body, which is
      # what #40 is about.
      - name: Take the workspace back from the Crowdin container
        if: steps.pr.outputs.number != ''
        run: sudo chown -R "$(id -u):$(id -g)" .

      # Everything from here builds what the pull request contains, because
      # nothing else will - why is in summarize_l10n_failure.sh's header, with
      # the evidence. See #40.
      #
      # These steps deliberately do not use always(). They run only when the
      # ones before them succeeded, because a build against a tree that was
      # never overlaid would pass and report that the translations are fine.
      #
      # What is built is main's tree with the branch's translations laid over
      # it, not a checkout of the branch: that is what merging produces, and it
      # means the scripts come from main rather than from a long-lived branch
      # that will not carry them until it is next recreated.
      #
      # The submodules are what pub get needs - flipperlib and dartufbt are
      # path dependencies and it cannot resolve without them on disk. This is
      # also a reset: the Crowdin action has already worked in this tree and
      # may have left it on the localization branch, so the checkout is not
      # redundant with the one at the top of the job.
      - name: Check out the code the translations will merge into
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Lay the pull request's translations over it
        if: steps.pr.outputs.number != ''
        run: |
          git fetch --depth=1 origin l10n/crowdin
          # Removed first, because `git checkout <tree> -- <path>` adds and
          # modifies but never deletes. A language dropped on Crowdin would
          # otherwise keep main's copy, and crowdin.yml's own note explains why
          # that matters: gen-l10n refuses a country-coded ARB unless the base
          # file for that language sits beside it, so a deletion that vanished
          # here would build clean and break on main.
          rm -rf translations
          git checkout FETCH_HEAD -- translations
          test -f translations/app_en.arb
          git --no-pager diff --stat HEAD -- translations

      # Why a translation would arrive declaring a locale its filename
      # contradicts is in check_arb_locales.sh's header. Crowdin settles it at
      # the source now: a Custom Post-Export Processor app applies that same
      # rule to the export, before the download. So this is a check, and no
      # longer the repair it used to be.
      #
      # The repair is what the move was for. It ran on the branch, after the
      # action had already committed, which left the branch one value apart
      # from what Crowdin exports for good - so every sync had a diff whether
      # a translation had changed or not. #323 is the pull request that
      # produces: two commits that cancel each other, nothing else in it.
      # Correcting the export settles every country-coded language at once, and
      # `pt-PT`, `pt-BR`, `zh-CN`, `zh-TW`, `zh-HK`, `es-MX`, `fr-CA` and
      # `sr-CS` are all the same shape as the Spanish that found it.
      #
      # After the overlay, because the pull request's translations are what the
      # build below reads and so what this has to check. Run before it, it
      # would check main's, which are already known good.
      #
      # continue-on-error, as the repair was and for the same reason: this step
      # is not the verification. If it fails, the build below still runs and
      # the summariser puts a verdict on the pull request, which is better than
      # a red run that says nothing.
      #
      # `pub-get: false` below skips the copy of this inside setup-flutter, so
      # without this step the sync is the one path that checks no translation
      # at all - and if that Crowdin app is ever uninstalled, this is what
      # names the file.
      - name: Check every translation declares the locale its filename says
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        run: .github/scripts/check_arb_locales.sh

      # pub-get: false, then run it below. Not because of the message any more
      # - the action now picks that from the output - but because this job
      # needs the output itself: the verdict in the pull request body is built
      # from it, and the phase it passes the summariser depends on which of the
      # two commands produced the status. Taking the action anyway is what
      # keeps the pinned SDK in one place.
      - name: Install Flutter
        if: steps.pr.outputs.number != ''
        uses: ./.github/actions/setup-flutter
        with:
          pub-get: "false"

      # firebase_options.dart is generated, gitignored and never restored in
      # CI, and push_service.dart imports it - so without this the analyze
      # below fails on every run with uri_does_not_exist, and the sync reports
      # a broken translation that nobody broke. ci.yml does the same for the
      # same reason.
      - name: Stub the Firebase configuration
        if: steps.pr.outputs.number != ''
        run: .github/scripts/stub_firebase_config.sh

      # Both commands, because neither alone is enough - the three failure
      # shapes and which command sees each are in the script's header.
      - name: Build the translations
        id: build
        if: steps.pr.outputs.number != ''
        run: |
          # Errexit off across the measurement: a non-zero status here is the
          # answer, not a reason to abandon the step.
          set +e
          # --enforce-lockfile for the reason every other job uses it:
          # without it an overnight re-resolution changes the dependency
          # set, and flutter analyze treats infos as fatal by default - so
          # one new lint from a package nobody chose would fail the sync and
          # read as a translation problem. A lockfile that no longer matches
          # fails in the deps phase instead, which says plainly that no
          # translation is to blame.
          phase=deps
          flutter pub get --enforce-lockfile > "${RUNNER_TEMP}/l10n.txt" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            phase=analyze
            flutter analyze >> "${RUNNER_TEMP}/l10n.txt" 2>&1
            status=$?
          fi
          .github/scripts/summarize_l10n_failure.sh \
            "$status" "$phase" "${RUNNER_TEMP}/l10n.txt" \
            "$GITHUB_WORKSPACE" \
            > "${RUNNER_TEMP}/verdict.md"
          verdict=$?
          set -e
          cat "${RUNNER_TEMP}/l10n.txt"
          cat "${RUNNER_TEMP}/verdict.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$verdict"

      # The verdict goes above the status table, not below it. A broken
      # translation under twenty rows of language percentages is a notice
      # nobody reads.
      - name: Refresh the pull request
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          python3 .github/scripts/crowdin_summary.py > "${RUNNER_TEMP}/status.md"
          if [ -z "$NUMBER" ]; then
            echo "No open translation pull request to refresh."
            exit 0
          fi
          : > "${RUNNER_TEMP}/pr-body.md"
          if [ -f "${RUNNER_TEMP}/verdict.md" ]; then
            {
              cat "${RUNNER_TEMP}/verdict.md"
              echo
              echo "---"
              echo
            } >> "${RUNNER_TEMP}/pr-body.md"
          fi
          cat "${RUNNER_TEMP}/status.md" >> "${RUNNER_TEMP}/pr-body.md"
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
          echo "Refreshed pull request #${NUMBER}."

      # Built once above rather than fetched again: this is four Crowdin API
      # round trips, and the job already has the answer.
      - name: Report translation status
        if: "!cancelled()"
        run: |
          if [ -f "${RUNNER_TEMP}/status.md" ]; then
            cat "${RUNNER_TEMP}/status.md" >> "$GITHUB_STEP_SUMMARY"
          fi
