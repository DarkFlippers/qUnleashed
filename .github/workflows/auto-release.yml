name: Android, iOS, Linux, macOS, and Windows builds

env:
  # How long an artifact is kept. A dispatch build carries release filenames and
  # the release key, so it is kept briefly and cannot be mistaken for a
  # published asset. One place rather than the same expression and the same
  # two-line comment at each of the upload steps.
  ASSET_RETENTION: ${{ github.event_name == 'workflow_dispatch' && 1 || 90 }}

on:
  # A push to `main` builds `dev`; a release tag builds `release`. ADR 0014 §1.
  # Both go through the same jobs, because a stable binary is rebuilt from its
  # tag rather than promoted from a dev one - a promoted binary would carry the
  # channel it was built with, and a Play track cannot be read at runtime to
  # correct it.
  push:
    branches:
      - main
    tags:
      - "*"
    # Every push to `main` now builds five platforms, so a push that cannot
    # change a binary should not pay for it. Deliberately narrow: anything that
    # might reach the app - translations among them, since they are compiled in
    # - is left out of this list.
    #
    # This key also carries `tags`, so the filter may be in scope for a release
    # tag as well - and a filtered push produces no run, which
    # `assert-published` cannot catch. #291 is settling it; `docs/releasing.md`
    # warns against tagging a docs-only commit in the meantime.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "fastlane/**"
      - LICENSE
  # Builds every platform without publishing anything, so a change to the build
  # path can be tried without cutting a release. It does NOT exercise publishing:
  # artifact merging, SHA256SUMS, the release globs and the push notification all
  # live in `publish`, which a dispatch never reaches.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build as. It must name the version pubspec.yaml holds, and may not use the dev- prefix. Nothing is published."
        required: true
        type: string

# Read by default: the build jobs never write anything outside the run. The two
# jobs that do are granted it individually, so a dispatch is structurally unable
# to publish rather than merely gated off it.
permissions:
  contents: read

# A dispatch can be started from a tag ref, which would otherwise share a group
# with that tag's release push and cancel it.
#
# cancel-in-progress matters more now that every push to `main` builds: a burst
# of commits builds only the newest rather than queueing five runs of five
# platforms behind each other. A dev build is disposable, so losing the middle
# of a burst costs nothing - and the rolling prerelease would have been
# overwritten by the last one anyway.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Check GitHub server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Only the dispatch check below reads history, and this job is the one
          # thing on the critical path before the builds - so without the
          # expression a push would pay for a full clone it never looks at.
          # It gets depth 1.
          #
          # Quoted, and that is the whole of why this works. GitHub's `&&`/`||`
          # yield operand values rather than booleans, and the number 0 is
          # falsy there - so unquoted, `true && 0` is 0, `0 || 1` is 1, and a
          # dispatch silently got the depth the push branch asks for. It
          # shipped that way in #292 and stayed broken until the first dispatch
          # after it: the tag check right below reads the commit count, and
          # `derive_version.sh` refuses a shallow one rather than counting
          # wrong, so the run died in `guard` before any platform built. A
          # non-empty string is truthy, and checkout parses its inputs as
          # strings anyway. ASSET_RETENTION above is the same idiom and is
          # safe only because both of its values happen to be truthy.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

      - name: Cancel outside github.com
        if: ${{ github.server_url != 'https://github.com' }}
        run: |
          echo "Unsupported GitHub server: ${GITHUB_SERVER_URL}"
          exit 1

      - name: Confirm github.com
        if: ${{ github.server_url == 'https://github.com' }}
        run: echo "Running on ${{ github.server_url }}"

      - name: Validate the dispatched tag against pubspec
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/derive_version.sh --print -- "$RELEASE_TAG"

  # Android alone. Linux used to build here too and left over #280 - see
  # build-linux, which owns that story. Two facts belong here: Android does not
  # care which Ubuntu it is built on, because the NDK brings its own sysroot,
  # so this job stays on the floating label; and this is the job that publishes
  # the build identity, which is why the split left it here. See `outputs`.
  build-android:
    name: Build Android release
    needs: guard
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The identity the binaries were actually built with, for `publish` to
    # quote. It must not re-derive it: on a release the slot is
    # GITHUB_RUN_ATTEMPT, so re-running only the failed `publish` job would
    # increment it and announce a build number no artifact in the release
    # carries.
    outputs:
      version-name: ${{ steps.version.outputs.version_name }}
      version-code: ${{ steps.version.outputs.version_code }}
      channel: ${{ steps.version.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # derive_version.sh needs both. The published-version guard reads
          # `git tag`, and the build number counts commits - a default
          # checkout has one of them, and a shallow count would be a
          # plausible number that collides with every other shallow build.
          # The script refuses to guess rather than produce one.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Restore Flutter Firebase options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: .github/scripts/restore_firebase_config.sh dart

      - name: Restore Android Firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: .github/scripts/restore_firebase_config.sh android

      - name: Derive the build identity
        id: version
        shell: bash
        env:
          QU_BUILD_SERVER_URL: ${{ secrets.QU_BUILD_SERVER_URL }}
          QU_BUILD_SERVER_KEY: ${{ secrets.QU_BUILD_SERVER_KEY }}
          QU_CARTO_KEY: ${{ secrets.QU_CARTO_KEY }}
          # `secrets.SENTRY_DSN`, not `QU_SENTRY_DSN`: the secret is named
          # for Sentry, the env var for the dart-define that
          # `Telemetry.compiledDsn` reads. docs/releasing.md says so too.
          QU_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/derive_version.sh -- "$RELEASE_TAG"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are not configured. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub repository secrets."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          {
            echo "storeFile=upload-keystore.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android release APKs
        run: .github/scripts/build/android.sh

      - name: Note what a dispatch does not exercise
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          {
            echo "## Dispatch build - nothing was published"
            echo "Built as \`${{ inputs.tag }}\`. This run did NOT exercise:"
            echo "- artifact merging, SHA256SUMS, or the GitHub release"
            echo "- release notes and the asset globs"
            echo "- the push notification, or the pubspec bump on the default branch"
            echo ""
            echo "Artifacts carry release filenames and the release key. Do not promote them."
          } >> "$GITHUB_STEP_SUMMARY"

      # Existence was the only thing checked before this. An APK with no
      # libapp.so builds green, installs, and dies at launch.
      - name: Verify Android APKs
        run: .github/scripts/verify_apks.sh dist

      # continue-on-error stays on the calling step: it is not a composite
      # action key. This runs after the build and produces nothing a user
      # downloads, so a fault at Sentry must not throw away a release that is
      # already built - the symbols can be re-uploaded from the same commit.
      - name: Upload debug symbols to Sentry
        uses: ./.github/actions/upload-debug-symbols
        continue-on-error: true
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: dist/qunleashed_*_android_*.apk
          if-no-files-found: error
          retention-days: ${{ env.ASSET_RETENTION }}

  # Pinned, and the pin is the fix for #280. A Flutter Linux app links against
  # the host's GTK and GLib and ships neither, so the oldest system the binary
  # can start on is decided by the image it was compiled on - and `ubuntu-latest`
  # is not a floor, it is whatever GitHub last pointed that label at. It moved
  # from 22.04 to 24.04 and took the published asset with it.
  #
  # 22.04 is the floor because it was the oldest Ubuntu LTS in standard support
  # when this was pinned, and is the base of Mint 21.x, which is what #280 was
  # reported on. Debian 12 is at or above it on every library that matters, so
  # this covers that too.
  #
  # Two things will make that stale, on different dates: GitHub retiring this
  # runner label, and 22.04 leaving standard support in April 2027.
  # check_linux_abi.sh holds the numbers and lists the ways out;
  # docs/releasing.md is where the decision goes. Neither is this comment's to
  # make.
  build-linux:
    name: Build Linux release
    needs: guard
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # fetch-depth: see build-android.
          fetch-depth: 0

      # Linux needs one too, for the same reason Windows does and not for
      # Gradle: `sentry_flutter` pins `jni` to 0.14.2, whose CMake calls
      # `find_package(JNI REQUIRED COMPONENTS JVM)` on every platform except
      # Android, and `jni` is in linux/flutter/generated_plugins.cmake. Without
      # a JDK the configure step fails before anything is compiled. This was
      # invisible while Linux shared the Android job, which had a JDK for
      # Gradle - splitting the jobs is what made it this job's problem.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Restore Flutter Firebase options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: .github/scripts/restore_firebase_config.sh dart

      # Derived here rather than taken from build-android's outputs, which is
      # what Windows and macOS already do. It is the same answer: the number
      # counts commits and the slot is the run attempt, both of which are
      # properties of the run rather than of the job. Only `publish` must not
      # re-derive it - see the comment on build-android's `outputs`.
      - name: Derive the build identity
        shell: bash
        env:
          QU_BUILD_SERVER_URL: ${{ secrets.QU_BUILD_SERVER_URL }}
          QU_BUILD_SERVER_KEY: ${{ secrets.QU_BUILD_SERVER_KEY }}
          QU_CARTO_KEY: ${{ secrets.QU_CARTO_KEY }}
          # secrets.SENTRY_DSN rather than QU_SENTRY_DSN: see build-android.
          QU_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/derive_version.sh -- "$RELEASE_TAG"

      # The last two are sentry-native's, which sentry_flutter builds from
      # source during the Flutter build: libcurl is its Linux transport
      # (`find_package(CURL REQUIRED)`, which is where this job once stopped),
      # and crashpad takes zlib from the system on everything but MSVC. The
      # runner image ships zlib, but an image default is not something a build
      # should rest on - the same argument the Windows JDK comment makes, and
      # ADR 0013's Consequences. Not the JDK above, which is a hard
      # requirement rather than an image default.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libcurl4-openssl-dev zlib1g-dev

      # Before the build, not after it: this half of the floor is a property of
      # the image and is knowable the moment pkg-config can see GLib, so a
      # wrong image should not cost three and a half minutes of compiling
      # first. It has to come after apt, which is what installs the GLib it
      # reads.
      - name: Check the Linux build image
        run: .github/scripts/check_linux_abi.sh --check-environment

      - name: Build Linux single-file executable
        run: .github/scripts/build/linux.sh

      # The runner pin above is the fix; this is what notices when the pin
      # stops holding. Existence was all that was checked before, and #280
      # built, uploaded and published green.
      - name: Check the Linux ABI floor
        run: .github/scripts/check_linux_abi.sh

      # continue-on-error: see build-android.
      - name: Upload debug symbols to Sentry
        uses: ./.github/actions/upload-debug-symbols
        continue-on-error: true
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: dist/qunleashed_*_linux_x64
          if-no-files-found: error
          retention-days: ${{ env.ASSET_RETENTION }}

  build-windows:
    name: Build Windows release
    needs: guard
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # derive_version.sh needs both. The published-version guard reads
          # `git tag`, and the build number counts commits - a default
          # checkout has one of them, and a shallow count would be a
          # plausible number that collides with every other shallow build.
          # The script refuses to guess rather than produce one.
          fetch-depth: 0

      # Windows needs one too, and not for Gradle. `sentry_flutter` pins `jni`
      # to 0.14.2, whose Windows CMake target calls `find_package(JNI)` - so
      # without a JDK the configure step fails with "Could NOT find JNI
      # (missing: JAVA_INCLUDE_PATH JAVA_INCLUDE_PATH2 JVM)" before anything is
      # compiled. The runner image happens to ship one, but an image default is
      # not something a build should rest on, and this pins the same version the
      # Android job does. ADR 0013 Consequences listed "a JDK on the Windows
      # runner" as a thing to verify: it is required, and this is it.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Restore Flutter Firebase options
        shell: bash
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: .github/scripts/restore_firebase_config.sh dart

      - name: Derive the build identity
        shell: bash
        env:
          QU_BUILD_SERVER_URL: ${{ secrets.QU_BUILD_SERVER_URL }}
          QU_BUILD_SERVER_KEY: ${{ secrets.QU_BUILD_SERVER_KEY }}
          QU_CARTO_KEY: ${{ secrets.QU_CARTO_KEY }}
          # `secrets.SENTRY_DSN`, not `QU_SENTRY_DSN`: the secret is named
          # for Sentry, the env var for the dart-define that
          # `Telemetry.compiledDsn` reads. docs/releasing.md says so too.
          QU_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/derive_version.sh -- "$RELEASE_TAG"

      - name: Build Windows raw ZIP and packaged EXE
        shell: pwsh
        env:
          # permission_handler_windows pulls in <experimental/coroutine> via C++/WinRT,
          # which the latest MSVC turns into a hard error. cl.exe reads _CL_ for extra
          # options, so this define reaches the plugin compile through MSBuild/CMake.
          _CL_: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: ./.github/scripts/build/windows.ps1

      # continue-on-error stays on the calling step: it is not a composite
      # action key. This runs after the build and produces nothing a user
      # downloads, so a fault at Sentry must not throw away a release that is
      # already built - the symbols can be re-uploaded from the same commit.
      - name: Upload debug symbols to Sentry
        uses: ./.github/actions/upload-debug-symbols
        continue-on-error: true
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            dist/qunleashed_*_windows_x64_raw.zip
            dist/qunleashed_*_windows_x64.exe
          if-no-files-found: error
          retention-days: ${{ env.ASSET_RETENTION }}

  build-macos:
    name: Build macOS and iOS releases
    needs: guard
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # derive_version.sh needs both. The published-version guard reads
          # `git tag`, and the build number counts commits - a default
          # checkout has one of them, and a shallow count would be a
          # plausible number that collides with every other shallow build.
          # The script refuses to guess rather than produce one.
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          swift-package-manager: "false"

      - name: Restore Flutter Firebase options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: .github/scripts/restore_firebase_config.sh dart

      - name: Restore macOS Firebase config
        env:
          MACOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.MACOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: .github/scripts/restore_firebase_config.sh macos

      - name: Restore iOS Firebase config
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: .github/scripts/restore_firebase_config.sh ios

      - name: Derive the build identity
        shell: bash
        env:
          QU_BUILD_SERVER_URL: ${{ secrets.QU_BUILD_SERVER_URL }}
          QU_BUILD_SERVER_KEY: ${{ secrets.QU_BUILD_SERVER_KEY }}
          QU_CARTO_KEY: ${{ secrets.QU_CARTO_KEY }}
          # `secrets.SENTRY_DSN`, not `QU_SENTRY_DSN`: the secret is named
          # for Sentry, the env var for the dart-define that
          # `Telemetry.compiledDsn` reads. docs/releasing.md says so too.
          QU_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/derive_version.sh -- "$RELEASE_TAG"

      - name: Install macOS build dependencies
        run: brew install automake libtool

      - name: Build macOS release
        run: .github/scripts/build/macos.sh

      - name: Build iOS release IPA
        run: .github/scripts/build/ios.sh

      # continue-on-error stays on the calling step: it is not a composite
      # action key. This runs after the build and produces nothing a user
      # downloads, so a fault at Sentry must not throw away a release that is
      # already built - the symbols can be re-uploaded from the same commit.
      - name: Upload debug symbols to Sentry
        uses: ./.github/actions/upload-debug-symbols
        continue-on-error: true
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload macOS and iOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            dist/qunleashed_*_macos_*.dmg
            dist/qunleashed_*_ios_*.ipa
          if-no-files-found: error
          retention-days: ${{ env.ASSET_RETENTION }}

  publish:
    name: Publish GitHub release
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    needs:
      - build-android
      - build-linux
      - build-macos
      - build-windows
    # Creates the GitHub release, so only ever for a push - a tag for a release,
    # `main` for a dev build. A dispatch can be started from a tag ref, so the
    # ref alone does not distinguish them; event_name is what does.
    if: ${{ github.server_url == 'https://github.com'
      && github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # `--print-channel` is decided by the trigger and returns before anything
      # reads git, and the version and number come from build-android's outputs -
      # so this job needed no history until `release_body.sh` did. It resolves
      # the `dev` tag and reads the changelog at it, which a depth-1 checkout
      # has neither; and nothing clears that tag on a release, so the commit it
      # names can be older than the last release and no fixed depth covers it.
      #
      # Fetching the tag shallowly instead does not work, and fails quietly:
      # `--depth 1` plus a refspec for `dev` resolves the tag and reads the blob,
      # but `rev-list --count dev..HEAD` then answers 1 for any distance, so the
      # commit-subject fallback - the usual path - publishes a single line
      # forever. That fallback needs ancestry between the tag and HEAD, not just
      # the tag.
      #
      # The version and number still come from build-android, not from a
      # derivation here.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      # The channel comes from derive_version.sh rather than a `dev-*` test of
      # this job's own. There were three readers of the tag prefix and they did
      # not have to agree; ADR 0014 §4 makes the script the only one. It also
      # means a push to `main`, which has no tag to test, resolves the same way
      # the build jobs do.
      # The version and number come from build-android, which is the one build
      # job that publishes them, not from a fresh derivation here: on a release
      # the slot is the run attempt,
      # so re-running only this job would quote a number no artifact carries.
      # The channel is derived, because it depends on the trigger alone and
      # cannot drift between jobs.
      - name: Resolve release channel
        id: channel
        shell: bash
        env:
          VERSION: ${{ needs.build-android.outputs.version-name }}
          NUMBER: ${{ needs.build-android.outputs.version-code }}
        run: |
          channel="$(.github/scripts/derive_version.sh --print-channel)"
          version="$VERSION"
          number="$NUMBER"
          if [[ -z "$version" || -z "$number" ]]; then
            echo "::error::The build job published no version; refusing to name a release after a guess." >&2
            exit 1
          fi

          # A dev build goes to one rolling prerelease tagged `dev`: one tag,
          # one link to bookmark, no history (ADR 0014 §7). A release goes to
          # the tag that was pushed.
          if [[ "$channel" == dev ]]; then
            release_tag=dev
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
          data="{\"type\":\"app\",\"url\":\"${release_url}\"}"

          {
            echo "release_tag=$release_tag"
            echo "channel=$channel"
            echo "version=$version"
            echo "number=$number"
            echo "data=$data"
          } >> "$GITHUB_OUTPUT"

          if [[ "$channel" == dev ]]; then
            # The name carries the version, since the tag no longer can - every
            # dev build is tagged `dev`, and §2 gives them all one version name
            # too, so the build number and the commit are what tell them apart.
            body="version: $version-dev ($number) | commit: ${GITHUB_SHA:0:7}"
            {
              echo "release_name=Development build $version-dev ($number)"
              echo "prerelease=true"
              echo "make_latest=false"
              # Naming the gap between two dev builds is what the body does
              # now, and it does it from the changelog - curated prose with a
              # credit per bullet. A generated list of pull request titles is
              # the same information worse, and measured against whichever tag
              # survives rather than the one this build replaces: the clear
              # step below takes `dev` before `action-gh-release` runs, so the
              # list would reach back to the last stable release.
              echo "generate_notes=false"
              echo "topic=app_dev"
              echo "title=New qUnleashed app dev build"
              echo "body=$body"
            } >> "$GITHUB_OUTPUT"
          else
            body="version: $version ($number)"
            # Generated notes list the pull requests since the previous tag,
            # which against curated prose carrying a credit per bullet is the
            # same information worse - and with 172 of them since the last
            # stable release, very much longer. Off, unconditionally; the
            # warning for a release with nothing written is
            # `release_body.sh`'s, which is where the changelog is read.
            {
              echo "release_name=${GITHUB_REF_NAME}"
              echo "prerelease=false"
              echo "make_latest=true"
              echo "generate_notes=false"
              echo "topic=app_release"
              echo "title=New qUnleashed app released"
              echo "body=$body"
            } >> "$GITHUB_OUTPUT"
          fi

          # `release_body.sh` owns the body, its shapes and the reasoning, and
          # has a test suite. It reads the changelog and the `dev` tag itself,
          # so all it needs from here is the channel and the one-liner.
          #
          # `body` stays the one-liner alone, because the push notification
          # sends it to a phone.
          body_path="$RUNNER_TEMP/release-body.md"
          .github/scripts/release_body.sh \
            --channel "$channel" --summary "$body" >"$body_path"
          # An EMPTY body_path file is a successful read as far as the
          # release action is concerned, so it would publish an empty body
          # rather than falling back to `body`. The script writes the one-liner
          # on every path it can exit 0 from, so empty here means something went
          # wrong that nothing else would report - and a release page with no
          # body is the failure this whole block exists to avoid.
          if [[ ! -s "$body_path" ]]; then
            echo "::error::The release body came out empty. Refusing to publish a release page with nothing on it." >&2
            exit 1
          fi

          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

      - name: Write SHA256SUMS
        run: .github/scripts/checksums.sh dist

      # The rolling prerelease is replaced rather than updated, and the reason is
      # the tag rather than the assets: `action-gh-release` uses an existing tag
      # as-is and will not move it, so an updated `dev` release would keep
      # pointing at whichever commit first created it while carrying the new
      # binaries. Its "Source code (zip)" and anything resolving `dev` to a SHA
      # would then describe a different build from the one attached - the worst
      # outcome available to a change whose whole point is that a report names a
      # build. `--cleanup-tag` takes the tag, and the publish step recreates it
      # here.
      #
      # Only "not found" is tolerated. `|| true` covered the first dev build
      # ever and swallowed everything else with it: a 5xx, a secondary rate
      # limit, or a later permissions tightening would leave the old release in
      # place, and the publish step would then update it and inherit the stale
      # tag - green, with no annotation anywhere.
      #
      # After SHA256SUMS, so a run that cannot even assemble its assets fails
      # with the previous prerelease still standing rather than leaving the
      # bookmarked link 404ing until the next green build.
      - name: Clear the previous dev prerelease
        if: ${{ steps.channel.outputs.release_tag == 'dev' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out="$(gh release delete dev --cleanup-tag --yes 2>&1)"; then
            echo "$out"
          elif grep -qiE 'release not found|HTTP 404' <<<"$out"; then
            echo "No dev prerelease to clear."
          else
            echo "::error::Could not clear the dev prerelease: $out"
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.release_tag }}
          name: ${{ steps.channel.outputs.release_name }}
          body: ${{ steps.channel.outputs.body }}
          body_path: ${{ steps.channel.outputs.body_path }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          generate_release_notes: ${{ steps.channel.outputs.generate_notes }}
          # Defaults to false, which would publish a release quietly missing an
          # asset - including SHA256SUMS itself.
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/qunleashed_*_android_*.apk
            dist/qunleashed_*_ios_*.ipa
            dist/qunleashed_*_linux_x64
            dist/qunleashed_*_macos_*.dmg
            dist/qunleashed_*_windows_x64_raw.zip
            dist/qunleashed_*_windows_x64.exe
            dist/SHA256SUMS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install push notification dependencies
        run: pip install firebase-admin

      - name: Send release push notification
        shell: bash
        env:
          FCM_SERVICE_ACCOUNT_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}
          PUSH_TOPIC: ${{ steps.channel.outputs.topic }}
          PUSH_TITLE: ${{ steps.channel.outputs.title }}
          PUSH_BODY: ${{ steps.channel.outputs.body }}
          PUSH_DATA: ${{ steps.channel.outputs.data }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT_BASE64" ]; then
            echo "::warning::FCM_SERVICE_ACCOUNT_BASE64 is not configured, skipping the push notification."
            exit 0
          fi
          python .github/scripts/notify_push.py "$PUSH_TOPIC" "$PUSH_TITLE" "$PUSH_BODY" "$PUSH_DATA"

  assert-published:
    name: Assert the release published
    needs: publish
    # `if:` skips do not fail a run, so a push that quietly produced no release
    # would otherwise be green - the worst outcome available here. Both kinds of
    # push are covered: a release that did not publish is the obvious case, and
    # a dev build that did not is how a rolling prerelease silently goes stale
    # while `main` moves on.
    # `!cancelled()` and not `always()`. `always()` runs on a cancelled run too,
    # and every push to `main` now shares one concurrency group with
    # cancel-in-progress - so a burst of commits would end with a failing job
    # and an error annotation on each superseded run, which is the opposite of
    # what the comment on that group says.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if publish did not run
        if: ${{ needs.publish.result != 'success' }}
        run: |
          echo "::error::Push finished without publishing (publish: ${{ needs.publish.result }})."
          exit 1

  # Publishing a release breaks `main` on purpose: until pubspec names a
  # version that has not been published, every push fails with "Version 0.16.0
  # has already been published". Two files have to move to clear it, and
  # `check_changelog.sh` refuses a changelog whose version line disagrees with
  # pubspec, so they move together.
  #
  # This opens a pull request; it does not push to `main`. Three reasons, and
  # the first is the one that decides it:
  #
  #  - the version is a person's call (0014 §2). A minor bump is what this
  #    project almost always opens, so that is what gets proposed - but a
  #    proposal in a pull request can be changed to 0.17.0 or 1.0.0 before it
  #    lands, and a commit pushed straight to `main` cannot.
  #  - `main` is branch-protected, so pushing would need a bypass or a personal
  #    token, granted to the workflow that holds the signing keys.
  #  - a push can race a merge and half-apply, leaving the release published
  #    and the cycle unopened - the exact state this exists to clear.
  open-next-cycle:
    name: Open the next cycle
    needs: publish
    if: ${{ needs.publish.outputs.channel == 'release' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `main`, not the tag this run was started from: that is where the bump
      # has to land, and a release is a tag push so the default ref is wrong.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      # The release published the changelog as it stood at the tag, and this
      # job works on `main`. Five platform builds take the better part of an
      # hour, so a bullet merged in between was published in no release and
      # would then be deleted by the reset - silently, because replacing the
      # file conflicts with nothing. Refuse instead: `main` stays red, which it
      # already was, and nobody's credited note is thrown away.
      - name: Refuse to reset notes that landed after the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          if ! git diff --quiet "$TAG" HEAD -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md on main differs from tag $TAG, so notes landed after the release was cut. They would be lost by the reset - open the next cycle by hand, carrying them over."
            exit 1
          fi

      - name: Write the bump and reset the changelog
        id: cycle
        shell: bash
        env:
          RELEASED: ${{ needs.publish.outputs.version }}
        run: |
          next="$(.github/scripts/open_next_cycle.sh "$RELEASED")"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Opening the $next cycle, released $RELEASED."

      # The pull request below carries no checks of its own: GitHub starts no
      # workflow for an event caused by the repository's own GITHUB_TOKEN. So
      # the guard runs here, against the files that are about to be committed,
      # rather than being first trusted after somebody merges them.
      - name: Check what it wrote
        run: .github/scripts/check_changelog.sh

      # The commit and pull request bodies go through files. Inlining them as
      # `-m "..."` across several lines carries the continuation's own
      # indentation into the message - two leading spaces on the body's first
      # line, invisible here and permanent in the commit.
      - name: Open the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.cycle.outputs.next }}
          RELEASED: ${{ needs.publish.outputs.version }}
        run: |
          branch="chore/open-$NEXT"

          cat >"$RUNNER_TEMP/commit-msg.txt" <<EOF
          Open the $NEXT cycle

          $RELEASED has been released, so every push to main fails until
          pubspec names a version that has not been. The changelog's notes
          shipped with it and go back to a skeleton; the guard refuses the two
          disagreeing, so they move together.

          The version is a minor bump by default, which is what this project
          almost always opens. Change it here if this cycle is a patch or a
          major - ADR 0014 keeps that digit for a person, and this is the pull
          request where it is still a proposal.
          EOF

          cat >"$RUNNER_TEMP/pr-body.md" <<EOF
          $RELEASED is out, so \`main\` is red until pubspec names a version that
          has not been published. This bumps it to **$NEXT** and resets
          \`CHANGELOG.md\` to its skeleton, in one commit because
          \`check_changelog.sh\` refuses the two disagreeing.

          **The version is a default, not a decision.** A minor bump is what
          this project almost always opens; if $RELEASED should be followed by a
          patch or a major, change the two lines before merging.
          [ADR 0014](https://github.com/DarkFlippers/qUnleashed/blob/main/docs/adr/0014-build-identity.md)
          §2 keeps that digit for a person, which is why this is a draft pull
          request rather than a push to \`main\`: since 0.11.0 the releases have
          gone four minors and four patches, so a minor is a coin flip, not a
          safe guess.

          This carries no checks: GitHub starts no workflow for an event the
          repository's own token caused. The release run checked the changelog
          against the committed files before opening this.

          Opened by the release run for $RELEASED.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pubspec.yaml CHANGELOG.md
          git commit -F "$RUNNER_TEMP/commit-msg.txt"

          # Checked before anything is pushed, so an open proposal is never
          # rewritten. This job's one invitation is "change the version before
          # merging", and the only place to accept it is this branch.
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "::notice::Pull request #$existing already opens the $NEXT cycle; leaving it alone."
            exit 0
          fi

          # No --force. A re-run of the release would otherwise regenerate the
          # default minor bump and overwrite a reviewer's edit on this branch,
          # leaving the pull request open and silently carrying the bot's digit
          # again. --force-with-lease is not the fix: the job fetches only
          # `main`, so there is no remote-tracking ref to lease against and the
          # push is rejected as stale - and fetching the branch first in the
          # same run makes the lease vacuous and overwrites the commit anyway.
          # Both were reproduced before settling on this.
          #
          # A rejection here means a branch already opens this cycle, which is
          # not a failure: the content is derived from the released version, so
          # every attempt writes the same thing.
          git push origin "$branch" ||
            echo "::notice::$branch already opens this cycle; leaving it as it stands."

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Open the $NEXT cycle - confirm the digit" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --assignee mishamyte \
            --draft \
            --milestone "Release preparation" ||
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Open the $NEXT cycle - confirm the digit" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --assignee mishamyte \
              --draft
