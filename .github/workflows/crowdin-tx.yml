name: Crowdin TX

on:
  push:
    branches:
      - main
    paths:
      - "translations/app_en.arb"
      - "fastlane/metadata/android/en-US/**"
      - "crowdin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  upload:
    name: Send English strings to Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Sources only, in one direction. Crowdin holds the translations now -
      # seeded from this repository on 2026-09-11, run 34567567053, 1,241
      # strings at 100% - so uploading them from here again would push a copy
      # over the original. There is deliberately no way to ask for it: the
      # seed_translations input this workflow used to carry has been removed
      # now that it has served its one purpose, because the next person to
      # find it would reasonably assume it was safe to run.
      - name: Upload sources
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          # The CLI keeps a string that has left the source file unless this is
          # passed, so without it every key ever deleted from app_en.arb stays
          # in the project: translators work on strings the app does not have,
          # and the completion percentages this job reports are measured
          # against a denominator of dead keys. #41.
          #
          # Audited before turning it on, as #41 asks, and it found nothing to
          # delete. On d101d1e the repository holds 1309 ARB strings plus five
          # in the store listing - one short description, three paragraphs of
          # the full one, one changelog - and Crowdin reports exactly 1314. So
          # this is a no-op today, which is the safest moment there will ever
          # be to enable it and the reason no report-only pass is needed first.
          #
          # What keeps it safe afterwards is not this workflow. Deleting a
          # string discards its translations in every locale, and the run that
          # would do it happens after a merge - but a key cannot leave
          # app_en.arb while the Dart still asks for it, because `gen-l10n`
          # stops generating the getter and `flutter analyze` fails on the
          # call. A string reaches this flag only once nothing uses it.
          upload_sources_args: "--delete-obsolete"
          upload_translations: false
          download_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Report translation status
        if: always()
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: python3 .github/scripts/crowdin_summary.py >> "$GITHUB_STEP_SUMMARY"
