name: Upload debug symbols to Sentry
description: >
  Uploads the debug files for whatever the calling job has just built, so a
  stack trace names functions and lines rather than addresses. Apple dSYMs,
  Windows PDBs, and the Linux and Android native libraries. Not a Dart symbol
  map, and not the Android R8 mapping - see the note below for both.

inputs:
  auth-token:
    description: >
      The Sentry auth token. Absent on a fork and on a dispatch run by somebody
      without access to the secret, which is handled rather than failed.
    required: false
    default: ""

# `sentry_dart_plugin` finds native debug files by handing a fixed list of
# build directories to `sentry-cli debug-files upload`
# (`lib/src/utils/flutter_debug_files.dart`, read against 3.4.0 - its own
# authors mark the Windows entry provisional). The `app*.{dSYM,symbols}`
# regexp beside it is only for the Dart symbol map. So the question per
# platform is never whether the plugin looks; it is whether the build wrote
# anything for it to find, which until #310 it did not on Windows or Linux.
#
# Both now assert that it did, and fail the build rather than publish
# something Sentry cannot read: `build/windows.ps1` wants the runner's PDB
# beside the executable, `build/linux.sh` wants `.debug_info` in it.
#
# There is no Dart symbol map, because no build passes `--split-debug-info`.
# That is harmless - without `--obfuscate` the AOT snapshot keeps its names.
# The Android R8 mapping is still owed and wants the Sentry Android Gradle
# Plugin. ADR 0013 Consequences holds the full inventory and is the copy to
# update first.
runs:
  using: composite
  steps:
    # The token is read from the environment and never compiled in: a
    # --dart-define lands in the binary, and anyone with the APK could read it
    # out. The DSN is the one that ships.
    #
    # The release name comes from SENTRY_RELEASE, which derive_version.sh wrote
    # to GITHUB_ENV and the plugin reads from the environment ahead of both its
    # own argument and the pubspec - so there is no flag here to drift from
    # that line.
    #
    # The absent-token check is in the script rather than in `if:`, because a
    # step's own `env:` is not in scope for its `if:` - and `secrets` is not
    # available to a step `if:` at all, so neither spelling of the expression
    # would work. A fork and a dispatch run without the secret both have to be
    # able to build; the release is not gated on symbolication.
    - name: Upload
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
      run: |
        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          echo "::notice::SENTRY_AUTH_TOKEN is not set, so no debug symbols were uploaded. Stack traces from this build will not be symbolicated."
          exit 0
        fi
        dart run sentry_dart_plugin
