name: Upload debug symbols to Sentry
description: >
  Uploads the debug files for whatever the calling job has just built, so a
  stack trace names functions and lines rather than addresses. Apple dSYMs,
  Windows PDBs, the Linux and Android native libraries, and - where R8 left
  one - the Android mapping that turns a renamed Java frame back into a class
  and a method. Not a Dart symbol map; see the note below.

inputs:
  auth-token:
    description: >
      The Sentry auth token. Absent on a fork and on a dispatch run by somebody
      without access to the secret, which is handled rather than failed.
    required: false
    default: ""

# `sentry_dart_plugin` finds native debug files by handing a fixed list of
# build directories to `sentry-cli debug-files upload`
# (`lib/src/utils/flutter_debug_files.dart`, read against the 3.4.0 the
# lockfile pins). The `app*.{dSYM,symbols}` regexp beside it adds Flutter's
# `--split-debug-info` output to the same upload; no build here passes that
# flag, which is harmless, because without `--obfuscate` the AOT snapshot
# keeps its names.
#
# So the question per platform is never whether the plugin looks. It is what
# the build wrote for it to find, and until #310 that was a PDB on no Windows
# target and no DWARF in any Linux binary - export and symbol tables only,
# which is why a frame resolved to the nearest export instead of to nothing.
# `build/windows.ps1` and `build/linux.sh` now refuse to package a build in
# that state.
#
# What they cannot assert is this step. Publication is not gated on it: the
# calling step is `continue-on-error`, deliberately, so a Sentry outage does
# not discard a built release - which means a failure here has to be loud in
# the job summary or it is invisible on a green run. That is what the
# failure branch below is for.
#
# The Android R8 mapping is the one debug file the Dart plugin cannot carry -
# a mapping is not a debug file and is in none of those directories - so the
# second step below sends it, with its own sentry-cli. It is gated on R8 having
# left a mapping, which is a property of the build rather than of the platform,
# so the three jobs that never run R8 skip the step without naming themselves.
#
# It is here rather than in the build for the reason
# `android/app/build.gradle.kts` records at length: the Gradle plugin's upload
# throws from an action that file does not own, and it is a finalizer of
# `assembleRelease`, so an unreachable Sentry would discard APKs that were
# already built. Here, the same fault costs a warning. #343. ADR 0013
# Consequences holds the full inventory and is the copy to update first.
runs:
  using: composite
  steps:
    # The token is read from the environment and never compiled in: a
    # --dart-define lands in the binary, and anyone with the APK could read it
    # out. The DSN is the one that ships.
    #
    # The release name comes from SENTRY_RELEASE, which derive_version.sh wrote
    # to GITHUB_ENV and the plugin reads from the environment ahead of both its
    # own argument and the pubspec - so there is no flag here to drift from
    # that line.
    #
    # The absent-token check is in the script rather than in `if:`, because a
    # step's own `env:` is not in scope for its `if:` - and `secrets` is not
    # available to a step `if:` at all, so neither spelling of the expression
    # would work. A fork and a dispatch run without the secret both have to be
    # able to build; the release is not gated on symbolication.
    - name: Upload
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
      run: |
        # Both branches below write to the step summary, not only to an
        # annotation. `::notice::` is the quietest thing GitHub has and a
        # collapsed step inside a green job is not read; the summary is what
        # somebody actually looks at after a release. Without this, "the
        # symbols did not reach Sentry" looks exactly like a successful run
        # until the next crash report comes back unsymbolicated - which is how
        # #310 lasted three releases.
        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          echo "::notice::SENTRY_AUTH_TOKEN is not set, so no debug symbols were uploaded. Stack traces from this build will not be symbolicated."
          {
            echo "### Debug symbols were not uploaded"
            echo "No \`SENTRY_AUTH_TOKEN\` on this \`${RUNNER_OS}\` build, which is expected on a fork or a dispatch without the secret. Nothing from it symbolicates: native frames resolve to addresses, and an R8 mapping, where there was one, was not sent either."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"
          exit 0
        fi

        # The exit status is not sufficient on its own. `_executeAndLog` in
        # `sentry_dart_plugin` 3.4.0 catches an exception from *starting*
        # sentry-cli, logs one plain line and returns false - and its caller
        # discards that bool, so the plugin finalizes the release and exits 0.
        # A binary that failed to download or spawn therefore looks exactly
        # like a successful upload, which is #310's shape one layer up from
        # where this change fixed it. A non-zero exit *code* from sentry-cli
        # does propagate, so both signals are read: the status, and the line
        # the plugin prints when it swallows one.
        #
        # `exit 0` on failure is deliberate and matches the `continue-on-error`
        # on every caller: the release is built and must not be thrown away
        # over Sentry. The point is that it says so where it will be seen, and
        # names the command that re-does it from this same commit.
        log="${RUNNER_TEMP:-/tmp}/sentry-upload.log"
        set +e
        dart run sentry_dart_plugin 2>&1 | tee "$log"
        status="${PIPESTATUS[0]}"
        set -e
        if [ "$status" -ne 0 ] || grep -qE "^Failed to (upload|create|finalize)" "$log"; then
          echo "::warning::sentry_dart_plugin failed. This build's native frames will NOT symbolicate until the symbols are re-uploaded."
          {
            echo "### Debug symbols were not uploaded"
            echo "The \`${RUNNER_OS}\` build of \`${SENTRY_RELEASE:-unknown}\` published **without** symbols."
            echo ""
            echo "Re-upload from this commit:"
            echo '```'
            echo "SENTRY_RELEASE=${SENTRY_RELEASE:-<release>} SENTRY_AUTH_TOKEN=<token> dart run sentry_dart_plugin"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"
          exit 0
        fi

        # And a line on success, so that "uploaded" and "this step never ran"
        # stop looking identical. Three different things produced an empty
        # summary before: a good upload, the step being dropped from a job, and
        # the swallowed-failure case above. Only one of them is fine.
        {
          echo "### Debug symbols uploaded"
          echo "\`${RUNNER_OS}\` build of \`${SENTRY_RELEASE:-unknown}\`."
        } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"

    # The R8 mapping, which the step above cannot carry. Separate because it is
    # a separate tool with a separate failure: the Dart plugin's own upload
    # succeeding says nothing about this one, and the reverse.
    #
    # The two addresses come from the artifacts rather than from a second copy
    # of anything. The UUID is read back out of a built APK, so the mapping is
    # filed under the identifier events will actually carry - not one
    # re-derived from a mapping that a later R8 run might have changed. The org
    # and project come from `pubspec.yaml`'s `sentry:` block, the same two
    # lines `sentry_dart_plugin` reads above, so there is one place to change
    # them and no way for the two uploads to disagree about where they are
    # going.
    - name: Upload the R8 mapping
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
        # Pinned and verified for the reason `lint_workflows.sh` gives about
        # actionlint: this runs in the same repository whose release job holds
        # the signing key, so a tool it fetches is not something to take on
        # trust from a moving tag. 3.8.0 is also the version the Sentry Gradle
        # plugin bundles, so the mapping is sent by the same code that minted
        # the UUID for it.
        SENTRY_CLI_VERSION: "3.8.0"
        SENTRY_CLI_SHA256: 13f8cb34ae01a6a272d7d7c22e277a105286615b4020de900ea95a8de47cdbb6
      run: |
        set -Eeuo pipefail

        # Whether R8 ran, not which platform this is. The three jobs that never
        # minify have no mapping and leave without fetching anything.
        mapping="build/app/outputs/mapping/release/mapping.txt"
        if [ ! -f "$mapping" ]; then
          exit 0
        fi

        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          # The step above already said this, for the same missing secret.
          exit 0
        fi

        # Read from a built APK, which is the only copy that matters: an event
        # carries the UUID the APK shipped with, so a mapping filed under any
        # other is a mapping nothing points at. `verify_apks.sh` has already
        # refused the build if this is absent, so a miss here is a miss in
        # whatever changed between the two.
        apk="$(find dist -maxdepth 1 -name '*_android_universal.apk' -print -quit 2>/dev/null || true)"
        if [ -z "$apk" ]; then
          echo "::warning::No universal APK in dist/, so the R8 mapping's UUID could not be read. Android Java frames from this build will NOT deobfuscate."
          {
            echo "### The R8 mapping was not uploaded"
            echo "R8 wrote a mapping for \`${SENTRY_RELEASE:-unknown}\` but no universal APK was found to read its UUID from, so the mapping was not sent."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"
          exit 0
        fi

        uuid="$(unzip -p "$apk" assets/sentry-debug-meta.properties \
          | sed -nE 's/^io\.sentry\.ProguardUuids=([0-9a-fA-F-]{36})$/\1/p' | head -n 1)"
        if [ -z "$uuid" ]; then
          echo "::warning::$(basename "$apk") carries no io.sentry.ProguardUuids, so the R8 mapping has nothing to be filed under. Android Java frames from this build will NOT deobfuscate."
          {
            echo "### The R8 mapping was not uploaded"
            echo "\`$(basename "$apk")\` carries no \`io.sentry.ProguardUuids\`, so the mapping could not be addressed."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"
          exit 0
        fi

        # One source for both slugs. `sentry:` is a top-level block of two
        # scalars, so the keys are read from inside it rather than from
        # anywhere in the file that happens to say `project:`.
        sentry_block="$(sed -n '/^sentry:$/,/^[^[:space:]]/p' pubspec.yaml)"
        org="$(sed -nE 's/^[[:space:]]+org:[[:space:]]*(\S+)[[:space:]]*$/\1/p' <<<"$sentry_block" | head -n 1)"
        project="$(sed -nE 's/^[[:space:]]+project:[[:space:]]*(\S+)[[:space:]]*$/\1/p' <<<"$sentry_block" | head -n 1)"
        if [ -z "$org" ] || [ -z "$project" ]; then
          echo "::error::pubspec.yaml's sentry: block has no org or no project, so nothing can be uploaded to Sentry at all."
          exit 1
        fi

        cli="${RUNNER_TEMP:-/tmp}/sentry-cli"
        curl -fsSL -o "$cli" \
          "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
        echo "${SENTRY_CLI_SHA256}  ${cli}" | sha256sum --check --quiet
        chmod +x "$cli"

        # `exit 0` on failure, and loudly, for the reason the step above gives:
        # the release is built and must not be thrown away over Sentry. Unlike
        # the Dart plugin, sentry-cli's own exit code is the whole signal - the
        # swallowing #310 turned on was the plugin's, one layer up from here.
        if ! "$cli" upload-proguard --uuid "$uuid" --org "$org" --project "$project" "$mapping"; then
          echo "::warning::Uploading the R8 mapping failed. Android Java and Kotlin frames from this build will NOT deobfuscate until it is re-uploaded."
          {
            echo "### The R8 mapping was not uploaded"
            echo "The Android build of \`${SENTRY_RELEASE:-unknown}\` published **without** it, so its Java and Kotlin frames will not deobfuscate. Dart and native frames are unaffected."
            echo ""
            echo "Re-upload the mapping this build produced, from a machine that still has it:"
            echo '```'
            echo "sentry-cli upload-proguard --uuid $uuid --org $org --project $project $mapping"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"
          exit 0
        fi

        {
          echo "### R8 mapping uploaded"
          echo "\`$uuid\`, for the Android build of \`${SENTRY_RELEASE:-unknown}\`."
        } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"
